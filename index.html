<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <div class="navbar">
        <h2 class="logo">My Website</h2>

        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </div>

    <!-- Home Section -->
    <div class="hero">
        <div class="content">
            <h1>Welcome to My Website</h1>
            <p>This website is made using HTML and CSS.</p>

            <button class="btn1">Get Started</button>
            <button class="btn2">Learn More</button>
        </div>
    </div>

    <!-- About Section -->
    <section id="about" class="about">
        <h2>About</h2>
        <p>
            This is a simple responsive homepage created using HTML and CSS.
        </p>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="contact">
        <h2>Contact Us</h2>

        <form>
            <input type="text" placeholder="Enter Name" required><br>

            <input type="email" placeholder="Enter Email" required><br>

            <textarea placeholder="Enter Message" rows="5"></textarea><br>

            <button type="submit">Submit</button>
        </form>
    </section>

</body>
</html>
